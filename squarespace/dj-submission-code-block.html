<div
  id="xodia-dj-submission-embed"
  data-app-origin="https://YOUR-DJ-DATABASE-DOMAIN.up.railway.app"
>
  <iframe
    id="xodia-dj-submission-frame"
    title="DJ Profile Submission"
    loading="lazy"
    allow="clipboard-write"
  ></iframe>
  <p id="xodia-dj-submission-fallback">
    The submission form could not be displayed.
    <a id="xodia-dj-submission-link" href="#" target="_blank" rel="noopener noreferrer">
      Open the DJ profile submission form
    </a>
  </p>
</div>

<style>
  #xodia-dj-submission-embed {
    width: 100%;
    margin: 0 auto;
  }

  #xodia-dj-submission-frame {
    display: block;
    width: 100%;
    height: 1100px;
    min-height: 640px;
    border: 0;
    background: transparent;
  }

  #xodia-dj-submission-fallback {
    display: none;
    margin: 16px 0;
    text-align: center;
  }

  @media (max-width: 640px) {
    #xodia-dj-submission-frame {
      height: 1450px;
    }
  }
</style>

<script>
  (() => {
    const container = document.getElementById("xodia-dj-submission-embed");
    const iframe = document.getElementById("xodia-dj-submission-frame");
    const fallback = document.getElementById("xodia-dj-submission-fallback");
    const fallbackLink = document.getElementById("xodia-dj-submission-link");
    const appOrigin = container.dataset.appOrigin.replace(/\/$/, "");
    const submissionUrl = `${appOrigin}/submit?embed=1`;

    iframe.src = submissionUrl;
    fallbackLink.href = submissionUrl;

    iframe.addEventListener("error", () => {
      iframe.hidden = true;
      fallback.style.display = "block";
    });

    window.addEventListener("message", (event) => {
      if (event.source !== iframe.contentWindow || event.origin !== appOrigin) return;
      if (event.data?.type !== "xodia-dj-submission-height") return;

      const requestedHeight = Number(event.data.height);
      if (!Number.isFinite(requestedHeight)) return;

      iframe.style.height = `${Math.min(Math.max(requestedHeight, 640), 2400)}px`;
    });
  })();
</script>
